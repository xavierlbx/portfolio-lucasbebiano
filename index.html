    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Asap+Condensed:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>portfolio-lucasxavier</title>
    <script>
      ;(function () {
        var saved = localStorage.getItem('theme')
        var isDark = saved ? saved === 'dark' : true
        if (isDark) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.backgroundColor = '#0d0d0d'
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
